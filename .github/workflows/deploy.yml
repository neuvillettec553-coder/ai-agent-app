name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar o projeto (pasta normal ou app.zip)
        id: prep
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f app.zip ]; then
            mkdir -p _src
            unzip -q app.zip -d _src
            echo "dir=_src/ai-agent-app" >> "$GITHUB_OUTPUT"
          else
            echo "Nao encontrei package.json nem app.zip na raiz do repositorio."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
        working-directory: ${{ steps.prep.outputs.dir }}

      - name: Compilar
        run: npm run build
        working-directory: ${{ steps.prep.outputs.dir }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prep.outputs.dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        
